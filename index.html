<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Catcher — Deluxe Edition</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-mono-numbers {
      font-family: 'JetBrains Mono', monospace;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 selection:bg-amber-500/30">
  <div class="w-full max-w-xl bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-4 sm:p-6 flex flex-col gap-4 relative overflow-hidden">
    <div class="absolute -top-24 -left-24 w-60 h-60 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full flex items-center justify-between z-10">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 font-black text-lg">
          ★
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">Star Catcher</h1>
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/20">Deluxe</span>
          </div>
          <p class="text-xs text-slate-400 font-medium">Catch the celestial stars & build crazy combos</p>
        </div>
      </div>
    </div>
    <div id="canvasContainer" class="w-full aspect-[4/3] max-h-[460px] bg-slate-950 rounded-2xl border border-slate-800/90 overflow-hidden relative shadow-2xl select-none">
      <canvas id="gameCanvas" class="w-full h-full cursor-crosshair"></canvas>
    </div>
  </div>
</body>
</html>
