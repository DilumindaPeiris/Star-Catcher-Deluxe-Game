<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Catcher — Deluxe Edition</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-mono-numbers {
      font-family: 'JetBrains Mono', monospace;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 selection:bg-amber-500/30">
  <div class="w-full max-w-xl bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-4 sm:p-6 flex flex-col gap-4 relative overflow-hidden">
    <div class="absolute -top-24 -left-24 w-60 h-60 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full flex items-center justify-between z-10">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 font-black text-lg">
          ★
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">Star Catcher</h1>
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/20">Deluxe</span>
          </div>
          <p class="text-xs text-slate-400 font-medium">Catch the celestial stars & build crazy combos</p>
        </div>
      </div>
    </div>
    <div id="canvasContainer" class="w-full aspect-[4/3] max-h-[460px] bg-slate-950 rounded-2xl border border-slate-800/90 overflow-hidden relative shadow-2xl select-none">
      <canvas id="gameCanvas" class="w-full h-full cursor-crosshair"></canvas>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');

    let logicalWidth = 480;
    let logicalHeight = 360;

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      logicalWidth = rect.width || 480;
      logicalHeight = rect.height || 360;

      canvas.width = Math.floor(logicalWidth * dpr);
      canvas.height = Math.floor(logicalHeight * dpr);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      if (Math.random() < 0.45) {
        cursorParticles.push({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          size: Math.random() * 2 + 1,
          alpha: 0.9
        });
      }
    });

    window.addEventListener('resize', resizeCanvas);
    let backgroundStars = [];
    let cursorParticles = [];
    let lastTimestamp = 0;

    function initBackgroundStars() {
      backgroundStars = [];
      const starCount = 55;
      for (let i = 0; i < starCount; i++) {
        backgroundStars.push({
          x: Math.random() * logicalWidth,
          y: Math.random() * logicalHeight,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.7 + 0.2,
          speed: Math.random() * 0.03 + 0.01,
          twinklePhase: Math.random() * Math.PI * 2
        });
      }
    }

    function render(dt) {
      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // Distant Twinkling Stars
      backgroundStars.forEach(bs => {
        bs.twinklePhase += bs.speed;
        const currentAlpha = bs.alpha * (0.6 + Math.sin(bs.twinklePhase) * 0.4);
        ctx.fillStyle = `rgba(226, 232, 240, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(bs.x, bs.y, bs.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Cursor Stardust Particles
      for (let i = cursorParticles.length - 1; i >= 0; i--) {
        const cp = cursorParticles[i];
        cp.x += cp.vx;
        cp.y += cp.vy;
        cp.alpha -= dt * 2.2;
        if (cp.alpha <= 0) {
          cursorParticles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = `rgba(251, 191, 36, ${cp.alpha * 0.8})`;
        ctx.beginPath();
        ctx.arc(cp.x, cp.y, cp.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Space Grid
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 32;
      for (let x = 0; x < logicalWidth; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, logicalHeight);
        ctx.stroke();
      }
      for (let y = 0; y < logicalHeight; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(logicalWidth, y);
        ctx.stroke();
      }
    }

    function gameLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = timestamp;

      render(dt);
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      initBackgroundStars();
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
