<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Catcher — Deluxe Edition</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-mono-numbers {
      font-family: 'JetBrains Mono', monospace;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 selection:bg-amber-500/30">
  <div class="w-full max-w-xl bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-4 sm:p-6 flex flex-col gap-4 relative overflow-hidden">
    <div class="absolute -top-24 -left-24 w-60 h-60 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Score Bar -->
    <div class="grid grid-cols-2 gap-2 pt-1 z-10">
      <div class="bg-slate-950/70 border border-slate-800/90 rounded-2xl p-2 sm:px-3 text-center flex flex-col justify-center">
        <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Score</div>
        <div id="scoreDisplay" class="text-xl sm:text-2xl font-black text-amber-400 font-mono-numbers tracking-tight">0</div>
      </div>
      <div class="bg-slate-950/70 border border-slate-800/90 rounded-2xl p-2 sm:px-3 text-center flex flex-col justify-center">
        <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Best</div>
        <div id="highScoreDisplay" class="text-xl sm:text-2xl font-black text-emerald-400 font-mono-numbers tracking-tight">0</div>
      </div>
    </div>

    <div class="w-full flex items-center justify-between z-10">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 font-black text-lg">
          ★
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">Star Catcher</h1>
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/20">Deluxe</span>
          </div>
          <p class="text-xs text-slate-400 font-medium">Catch the celestial stars & build crazy combos</p>
        </div>
      </div>
    </div>
    <div id="canvasContainer" class="w-full aspect-[4/3] max-h-[460px] bg-slate-950 rounded-2xl border border-slate-800/90 overflow-hidden relative shadow-2xl select-none">
      <canvas id="gameCanvas" class="w-full h-full cursor-crosshair"></canvas>
      <div id="frostOverlay" class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-300 border-[6px] border-cyan-400/40 bg-cyan-500/10 backdrop-blur-[0.5px]"></div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    let score = 0;
    let highScore = 0;

    let logicalWidth = 480;
    let logicalHeight = 360;

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      logicalWidth = rect.width || 480;
      logicalHeight = rect.height || 360;

      canvas.width = Math.floor(logicalWidth * dpr);
      canvas.height = Math.floor(logicalHeight * dpr);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }

    function handlePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        const dx = clickX - s.x;
        const dy = clickY - s.y;
        if (Math.sqrt(dx * dx + dy * dy) <= s.radius * 1.45) {
          stars.splice(i, 1);
          score += STAR_TYPES[s.type].points;
          if (score > highScore) highScore = score;
          scoreDisplay.textContent = score;
          highScoreDisplay.textContent = highScore;
          break;
        }
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handlePointer(e.clientX, e.clientY);
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      if (Math.random() < 0.45) {
        cursorParticles.push({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          size: Math.random() * 2 + 1,
          alpha: 0.9
        });
      }
    });

    window.addEventListener('resize', resizeCanvas);
    const STAR_TYPES = {
      GOLD: {
        name: 'Gold',
        points: 100,
        color: '#fbbf24',
        accent: '#fef08a',
        innerGlow: 'rgba(251, 191, 36, 0.5)',
        radius: 26,
        spikes: 5,
        weight: 65
      },
      NOVA: {
        name: 'Supernova',
        points: 250,
        color: '#c084fc',
        accent: '#f3e8ff',
        innerGlow: 'rgba(192, 132, 252, 0.6)',
        radius: 28,
        spikes: 4,
        weight: 15
      },
      COMET: {
        name: 'Rainbow Comet',
        points: 500,
        color: '#f43f5e',
        accent: '#ffe4e6',
        innerGlow: 'rgba(244, 63, 94, 0.6)',
        radius: 22,
        spikes: 7,
        weight: 10
      },
      FROST: {
        name: 'Frost',
        points: 150,
        color: '#38bdf8',
        accent: '#e0f2fe',
        innerGlow: 'rgba(56, 189, 248, 0.6)',
        radius: 25,
        spikes: 6,
        weight: 10
      },
      CHRONO: {
        name: 'Chrono',
        points: 150,
        color: '#34d399',
        accent: '#d1fae5',
        innerGlow: 'rgba(52, 211, 153, 0.6)',
        radius: 25,
        spikes: 5,
        weight: 10
      }
    };

    let stars = [];
    let backgroundStars = [];
    let cursorParticles = [];
    let lastTimestamp = 0;

    function drawStarPolygon(cx, cy, spikes, outerRadius, innerRadius) {
      let rot = (Math.PI / 2) * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
    }

    function getRandomStarType() {
      const rand = Math.random() * 100;
      if (rand < 20) return 'NOVA';
      if (rand < 30) return 'COMET';
      return 'GOLD';
    }

    function createStar() {
      const typeKey = getRandomStarType();
      const config = STAR_TYPES[typeKey];
      const config = STAR_TYPES.GOLD;
      const padding = config.radius + 20;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 0.6 + 0.2;

      return {
        type: typeKey,
        x: padding + Math.random() * (logicalWidth - padding * 2),
        y: padding + Math.random() * (logicalHeight - padding * 2),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: config.radius,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.04,
        pulsePhase: Math.random() * Math.PI,
        lifespan: 5.0,
        maxLifespan: 5.0
      };
    }

    function initBackgroundStars() {
      backgroundStars = [];
      const starCount = 55;
      for (let i = 0; i < starCount; i++) {
        backgroundStars.push({
          x: Math.random() * logicalWidth,
          y: Math.random() * logicalHeight,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.7 + 0.2,
          speed: Math.random() * 0.03 + 0.01,
          twinklePhase: Math.random() * Math.PI * 2
        });
      }
    }

    function render(dt) {
      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // Render Active Stars
      stars.forEach(s => {
        const config = STAR_TYPES[s.type];
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);
        const pulseScale = 1 + Math.sin(s.pulsePhase) * 0.06;
        const currentR = s.radius * pulseScale;

        // Outer Radial Glow
        const grad = ctx.createRadialGradient(0, 0, currentR * 0.2, 0, 0, currentR * 1.8);
        grad.addColorStop(0, config.innerGlow);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, currentR * 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Polygon Body & Outline
        drawStarPolygon(0, 0, config.spikes, currentR, currentR * 0.48);
        ctx.fillStyle = config.color;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = config.accent;
        ctx.stroke();
        ctx.restore();
      });

      // Distant Twinkling Stars
      backgroundStars.forEach(bs => {
        bs.twinklePhase += bs.speed;
        const currentAlpha = bs.alpha * (0.6 + Math.sin(bs.twinklePhase) * 0.4);
        ctx.fillStyle = `rgba(226, 232, 240, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(bs.x, bs.y, bs.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Cursor Stardust Particles
      for (let i = cursorParticles.length - 1; i >= 0; i--) {
        const cp = cursorParticles[i];
        cp.x += cp.vx;
        cp.y += cp.vy;
        cp.alpha -= dt * 2.2;
        if (cp.alpha <= 0) {
          cursorParticles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = `rgba(251, 191, 36, ${cp.alpha * 0.8})`;
        ctx.beginPath();
        ctx.arc(cp.x, cp.y, cp.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Space Grid
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 32;
      for (let x = 0; x < logicalWidth; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, logicalHeight);
        ctx.stroke();
      }
      for (let y = 0; y < logicalHeight; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(logicalWidth, y);
        ctx.stroke();
      }
    }

    function gameLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = timestamp;

      // Active Star Updates
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        s.rotation += s.rotSpeed;
        s.pulsePhase += 0.06;
        s.x += s.vx;
        s.y += s.vy;

        const pad = s.radius + 15;
        if (s.x < pad) { s.x = pad; s.vx *= -1; }
        if (s.x > logicalWidth - pad) { s.x = logicalWidth - pad; s.vx *= -1; }
        if (s.y < pad) { s.y = pad; s.vy *= -1; }
        if (s.y > logicalHeight - pad) { s.y = logicalHeight - pad; s.vy *= -1; }
      }

      if (stars.length < 2) stars.push(createStar());

      render(dt);
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      initBackgroundStars();
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
