<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Catcher — Deluxe Edition</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-mono-numbers {
      font-family: 'JetBrains Mono', monospace;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 selection:bg-amber-500/30">
  <h1 class="text-3xl font-black text-white">Star Catcher</h1>

</html>
